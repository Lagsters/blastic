<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>BlasTIC</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #1a1c2c; }
    #canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block;
              image-rendering: pixelated; touch-action: none; }
    #game-frame { position: absolute; inset: 0; display: flex; align-items: center;
                  justify-content: center; color: #fff; font: 44px monospace;
                  cursor: pointer; background: #1a1c2c; }
  </style>
</head>
<body>
  <canvas id="canvas" tabindex="0" oncontextmenu="event.preventDefault()"></canvas>
  <div id="game-frame">- CLICK TO PLAY -</div>
  <script>
    // The TIC-80 player (tic80.js, from the official html build) runs the cart
    // given as its argument from its in-memory file system, so preRun fetches
    // blastic.tic and writes it there before the player starts.
    var Module = {
      canvas: document.getElementById('canvas'),
      arguments: ['/blastic.tic'],
      preRun: [function () {
        addRunDependency('cart');
        fetch('blastic.tic')
          .then(function (r) { return r.arrayBuffer(); })
          .then(function (b) {
            FS.writeFile('/blastic.tic', new Uint8Array(b));
            removeRunDependency('cart');
          });
      }]
    };
    // Browsers allow sound only after a user gesture, so the player loads on click.
    document.getElementById('game-frame').addEventListener('click', function () {
      var s = document.createElement('script');
      s.src = 'tic80.js';
      document.body.appendChild(s);
      this.remove();
      document.getElementById('canvas').focus();
    });
  </script>
</body>
</html>
