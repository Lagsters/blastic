name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  cart:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Lua
        run: sudo apt-get update && sudo apt-get install -y lua5.4

      - name: Test game logic (TIC-80 API mocked)
        run: lua5.4 test_blastic.lua

      - name: Simulate bot-only rounds
        run: lua5.4 sim_blastic.lua 300 1

      # The cart holds only the code chunk, so the free TIC-80 is not needed:
      # loading/saving .lua text carts is a TIC-80 PRO feature.
      - name: Build cart
        run: python3 make_tic.py blastic.lua blastic.tic

      - uses: actions/upload-artifact@v4
        with:
          name: cart
          path: blastic.tic

      - name: Publish release asset
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum blastic.tic > blastic.tic.sha256
          gh release create "$GITHUB_REF_NAME" blastic.tic blastic.tic.sha256 \
            --title "$GITHUB_REF_NAME" --generate-notes
